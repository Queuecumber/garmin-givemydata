apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanhi-garmin-mcp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanhi-garmin-mcp
  namespace: autonome-nanhi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nanhi-garmin-mcp
  template:
    metadata:
      labels:
        app: nanhi-garmin-mcp
    spec:
      containers:
        - name: garmin-mcp
          image: ghcr.io/queuecumber/garmin-givemydata:latest
          ports:
            - name: mcp
              containerPort: 8000
          env:
            - name: GARMIN_DATA_DIR
              value: /data
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_PORT
              value: "8000"
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nanhi-garmin-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: nanhi-garmin-mcp
  namespace: autonome-nanhi
spec:
  ipFamilyPolicy: PreferDualStack
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
